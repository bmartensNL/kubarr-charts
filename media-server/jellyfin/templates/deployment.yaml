apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "jellyfin.fullname" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "jellyfin.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.jellyfin.replicaCount }}
  selector:
    matchLabels:
      {{- include "jellyfin.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "jellyfin.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "jellyfin.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        {{- if .Values.vpn.enabled }}
        # Gluetun VPN sidecar - routes all pod traffic through VPN
        - name: gluetun
          image: "{{ .Values.vpn.image.repository }}:{{ .Values.vpn.image.tag }}"
          imagePullPolicy: {{ .Values.vpn.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
          volumeMounts:
            - name: dev-net-tun
              mountPath: /dev/net/tun
          envFrom:
            - secretRef:
                name: {{ .Values.vpn.secretName }}
          env:
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: "{{ .Values.vpn.firewallOutboundSubnets }}"
            {{- if .Values.vpn.killSwitch }}
            - name: FIREWALL
              value: "on"
            - name: FIREWALL_INPUT_PORTS
              value: "{{ .Values.jellyfin.service.targetPort }},9999,8001"
            {{- else }}
            - name: FIREWALL
              value: "off"
            {{- end }}
            - name: HEALTH_SERVER_ADDRESS
              value: ":9999"
            # Move control server off port 8000 to avoid conflict with exporter
            - name: HTTP_CONTROL_SERVER_ADDRESS
              value: ":8001"
            {{- if .Values.vpn.portForwarding.enabled }}
            - name: VPN_PORT_FORWARDING
              value: "on"
            - name: PORT_FORWARD_ONLY
              value: "on"
            {{- if .Values.vpn.portForwarding.upCommand }}
            - name: VPN_PORT_FORWARDING_UP_COMMAND
              value: {{ .Values.vpn.portForwarding.upCommand | quote }}
            {{- end }}
            {{- end }}
          ports:
            - name: gluetun-http
              containerPort: 8888
              protocol: TCP
            - name: gluetun-ctrl
              containerPort: 8001
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: 9999
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: 9999
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            {{- toYaml .Values.vpn.resources | nindent 12 }}
        {{- end }}
        - name: jellyfin
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.jellyfin.image.repository }}:{{ .Values.jellyfin.image.tag }}"
          imagePullPolicy: {{ .Values.jellyfin.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.jellyfin.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "jellyfin.fullname" . }}-config
          {{- if .Values.jellyfin.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.jellyfin.livenessProbe.httpGet.path }}
              port: {{ .Values.jellyfin.livenessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.jellyfin.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.jellyfin.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.jellyfin.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.jellyfin.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.jellyfin.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.jellyfin.readinessProbe.httpGet.path }}
              port: {{ .Values.jellyfin.readinessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.jellyfin.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.jellyfin.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.jellyfin.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.jellyfin.readinessProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.jellyfin.resources | nindent 12 }}
          volumeMounts:
            {{- include "kubarr-common.storage.configMount" (dict "root" .) | nindent 12 }}
            {{- include "kubarr-common.storage.mediaMount" (dict "root" . "mountPath" .Values.storage.media.cacheMountPath "subPath" .Values.storage.media.cacheSubPath) | nindent 12 }}
            {{- include "kubarr-common.storage.mediaMount" (dict "root" . "mountPath" .Values.storage.media.mountPath "subPath" .Values.storage.media.dataSubPath "readOnly" .Values.storage.readOnly) | nindent 12 }}
      volumes:
        {{- if .Values.vpn.enabled }}
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        {{- end }}
        {{- include "kubarr-common.storage.configOrMediaVolume" (dict "root" . "fullname" (include "jellyfin.fullname" .)) | nindent 8 }}
      {{- include "kubarr-common.scheduling" . | nindent 6 }}

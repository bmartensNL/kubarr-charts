name: Publish

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  charts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Compute OCI repo
        id: vars
        run: echo "oci_repo=oci://${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Install Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2
        with:
          version: v3.21.0

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} --username ${{ github.actor }} --password-stdin

      - name: Package and push all charts
        run: |
          set -euo pipefail

          OCI_REPO="${{ steps.vars.outputs.oci_repo }}"
          echo "## Helm Charts Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          for chart_dir in */; do
            chart_name=$(basename "$chart_dir")

            if [ ! -f "$chart_dir/Chart.yaml" ]; then
              echo "Skipping $chart_name (no Chart.yaml)"
              continue
            fi

            version=$(helm show chart "$chart_dir" | grep '^version:' | awk '{print $2}')
            if helm show chart "$OCI_REPO/$chart_name" --version "$version" >/dev/null 2>&1; then
              echo "Skipping $chart_name:$version (already published)"
              echo "- \`${chart_name}:${version}\` already exists" >> $GITHUB_STEP_SUMMARY
              continue
            fi

            echo "Packaging $chart_name..."
            if grep -q 'repository: file://../kubarr-common' "$chart_dir/Chart.yaml"; then
              helm dependency build "$chart_dir"
            fi
            helm package "$chart_dir" --destination /tmp/helm-packages

            pkg=$(ls /tmp/helm-packages/${chart_name}-*.tgz 2>/dev/null | head -1)
            if [ -z "$pkg" ]; then
              echo "::warning::Failed to package $chart_name"
              continue
            fi

            echo "Pushing $chart_name..."
            helm push "$pkg" "$OCI_REPO"

            echo "- \`${chart_name}:${version}\` → \`${OCI_REPO}/${chart_name}\`" >> $GITHUB_STEP_SUMMARY

            rm -f "$pkg"
          done

      - name: Logout
        if: always()
        run: helm registry logout ${{ env.REGISTRY }} || true

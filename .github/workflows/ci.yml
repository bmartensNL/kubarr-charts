name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2
        with:
          version: v3.21.0
      - run: |
          set -euo pipefail

          for chart in */; do
            if [ -f "$chart/Chart.yaml" ]; then
              echo "Linting $chart..."
              if grep -q 'repository: file://../kubarr-common' "$chart/Chart.yaml"; then
                helm dependency build "$chart"
              fi
              helm lint "$chart"
            fi
          done

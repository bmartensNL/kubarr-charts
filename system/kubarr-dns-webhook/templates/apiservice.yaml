apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1alpha1.{{ .Values.groupName }}
  labels:
    {{- include "kubarr-dns-webhook.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Values.namespace.name }}/{{ include "kubarr-dns-webhook.name" . }}-serving-cert
spec:
  group: {{ .Values.groupName }}
  groupPriorityMinimum: 1000
  versionPriority: 15
  service:
    name: {{ include "kubarr-dns-webhook.name" . }}
    namespace: {{ .Values.namespace.name }}
    port: {{ .Values.service.port }}
  version: v1alpha1

{{- if not .Values.nfs.hostNetwork }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubarr-managed-nfs
  labels:
    {{- include "managed-nfs.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "managed-nfs.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 2049
      from:
        - namespaceSelector: {}
{{- end }}
